# On a v* tag: release binaries for macOS and Linux (GoReleaser) and the
# container image on ghcr.io (linux/amd64 and linux/arm64). Run by hand, or on
# a pull request that changes how releases are built, it builds both and
# publishes nothing.
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.goreleaser.yaml, Dockerfile, .dockerignore, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # pushes to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Furcate: agent traces you can fork from any step (collector and web UI)
            org.opencontainers.image.licenses=Apache-2.0

  # The README's quick start against what was just published.
  quickstart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image]
    permissions:
      contents: read
    uses: ./.github/workflows/quickstart.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
