# ClickHouse for spans and Postgres for run state, with credentials for these
# local containers only that match furcate's default DSNs. Every port is
# published on 127.0.0.1 only.
#
#   docker compose up -d --wait                  the stores (development, tests)
#   docker compose --profile app up -d --wait    plus the collector and a read-only
#                                                web UI on http://127.0.0.1:7070
#
# The app profile runs the released image (FURCATE_VERSION, default latest), or
# builds it from this checkout if it can't pull it.
services:
  collector:
    profiles: [app]
    image: ghcr.io/sanidhyasin/furcate:${FURCATE_VERSION:-latest}
    build: .
    command: ["collector", "-http", "0.0.0.0:4318", "-grpc", "0.0.0.0:4317"]
    environment:
      FURCATE_CLICKHOUSE: clickhouse://furcate:furcate@clickhouse:9000/furcate
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP
      - "127.0.0.1:4317:4317" # OTLP/gRPC
    volumes:
      - collector-wal:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  ui:
    profiles: [app]
    image: ghcr.io/sanidhyasin/furcate:${FURCATE_VERSION:-latest}
    build: .
    command: ["serve", "-listen", "0.0.0.0:7070"]
    environment:
      FURCATE_CLICKHOUSE: clickhouse://furcate:furcate@clickhouse:9000/furcate
      FURCATE_PG: postgres://furcate:furcate@postgres:5432/furcate?sslmode=disable
    ports:
      - "127.0.0.1:7070:7070"
    depends_on:
      collector:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "127.0.0.1:9000:9000" # native protocol (the collector and CLI)
      - "127.0.0.1:8123:8123" # HTTP, for clickhouse-client or curl
    environment:
      CLICKHOUSE_DB: furcate
      CLICKHOUSE_USER: furcate
      CLICKHOUSE_PASSWORD: furcate
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "furcate", "--password", "furcate", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:17.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: furcate
      POSTGRES_USER: furcate
      POSTGRES_PASSWORD: furcate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "furcate", "-d", "furcate"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
  postgres-data:
  collector-wal:
