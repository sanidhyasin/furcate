# Local stores for development: ClickHouse for spans, Postgres for run state. The
# credentials are for these local containers only and match the default DSNs.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "127.0.0.1:9000:9000" # native protocol (the collector and CLI)
      - "127.0.0.1:8123:8123" # HTTP, for clickhouse-client or curl
    environment:
      CLICKHOUSE_DB: furcate
      CLICKHOUSE_USER: furcate
      CLICKHOUSE_PASSWORD: furcate
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "furcate", "--password", "furcate", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:17.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: furcate
      POSTGRES_USER: furcate
      POSTGRES_PASSWORD: furcate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "furcate", "-d", "furcate"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
  postgres-data:
